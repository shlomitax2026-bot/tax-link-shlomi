<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>שלמה אלטרס - יועץ מס</title>
  <!-- תגי Open Graph - אלה מה שוואטסאפ קורא ומציג בתצוגה המקדימה -->
  <meta property="og:title" content="שלמה אלטרס - יועץ מס">
  <meta property="og:description" content="לחצו כדי למלא את טופס איסוף החומרים לדוח השנתי">
  <meta property="og:image" content="https://shlomitax2026-bot.github.io/tax-link-shlomi/logo.png">
  <meta property="og:url" content="https://shlomitax2026-bot.github.io/tax-link-shlomi/">
  <meta property="og:type" content="website">
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f4f4f4;
      text-align: center;
    }
    img {
      width: 120px;
      margin-bottom: 20px;
    }
    p {
      color: #333;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <img src="logo.png" alt="לוגו שלמה אלטרס">
  <p>מעביר אותך לטופס...</p>
  <script>
    const params = new URLSearchParams(window.location.search);
    const target = params.get("to");
    if (target) {
      window.location.replace(target);
    } else {
      document.querySelector("p").textContent = "לא נמצא קישור יעד.";
    }
  </script>
</body>
</html>
